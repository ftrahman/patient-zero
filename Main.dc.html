<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a50d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patient Zero">
<title>Patient Zero: Rules</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Nosifer&amp;family=Butcherman&amp;family=Eater&amp;family=Rubik+Wet+Paint&amp;family=Jolly+Lodger&amp;family=Special+Elite&amp;family=Courier+Prime:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;family=Work+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fbf8f5}
a{color:#a50d18}a:hover{color:#6e0710}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
.app-shell{height:100vh;height:100dvh}
@media (min-width: 600px){.app-shell{border-left:3px solid #241517;border-right:3px solid #241517}}
@keyframes ooze{0%{transform:translateY(-100%);opacity:1}70%{transform:translateY(0);opacity:1}88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes fall{0%,69%{opacity:0;transform:translateY(0) scaleY(1)}71%{opacity:1;transform:translateY(0) scaleY(1)}100%{opacity:0;transform:translateY(520px) scaleY(1.25)}}
@keyframes drip{0%{transform:translateY(0) scale(.3);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}75%{transform:translateY(22px);opacity:1}100%{transform:translateY(28px);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes slap{0%{transform:translateY(-50px) rotate(-25deg) scale(1.3);opacity:0}35%{transform:translateY(0) rotate(-8deg) scale(1);opacity:1}45%{transform:rotate(-8deg) scale(.9)}55%,100%{transform:rotate(-8deg) scale(1)}}
@keyframes draw{0%{stroke-dashoffset:280}60%,100%{stroke-dashoffset:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.2}}
@keyframes scan{0%,100%{transform:translate(-26px,-12px)}50%{transform:translate(26px,12px)}}
@keyframes check{0%,10%{stroke-dashoffset:24}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
@keyframes chatter{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes slosh{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; justify-content: center; background: #ebe1df; color: #241517; font-family: {{bodyFont}}">
<div class="app-shell" style="position: relative; width: 100%; max-width: 440px; overflow: hidden; background-color: #fbf8f5; background-image: repeating-linear-gradient(0deg, transparent 0px, transparent 31px, #f3e6e7 31px, #f3e6e7 32px); box-sizing: border-box">

<div style="position: absolute; top: 0; left: 0; right: 0; height: 100%; pointer-events: none; z-index: 0" aria-hidden="true">
<div style="position: absolute; top: 26px; left: 5%; width: 14px; height: 80px; animation: ooze 6s ease-in-out infinite"><svg style="position: absolute; top: 0; left: 0; width: 14px; height: 68px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 14px; height: 18px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 89px; left: calc(5% + 0.5px); width: 13px; height: 17px; opacity: 0; animation: fall 6s ease-in infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 16%; width: 11px; height: 50px; animation: ooze 7s ease-in-out 1.8s infinite"><svg style="position: absolute; top: 0; left: 0; width: 11px; height: 42px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 11px; height: 14px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 63px; left: calc(16% + 0.5px); width: 10px; height: 13px; opacity: 0; animation: fall 7s ease-in 1.8s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 31%; width: 18px; height: 118px; animation: ooze 8s ease-in-out .6s infinite"><svg style="position: absolute; top: 0; left: 0; width: 18px; height: 101px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 18px; height: 23px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 123px; left: calc(31% + 1px); width: 16px; height: 21px; opacity: 0; animation: fall 8s ease-in .6s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 47%; width: 12px; height: 64px; animation: ooze 6.5s ease-in-out 3.1s infinite"><svg style="position: absolute; top: 0; left: 0; width: 12px; height: 54px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 12px; height: 16px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 76px; left: calc(47% + 0.5px); width: 11px; height: 14px; opacity: 0; animation: fall 6.5s ease-in 3.1s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 61%; width: 16px; height: 96px; animation: ooze 7.5s ease-in-out 1.1s infinite"><svg style="position: absolute; top: 0; left: 0; width: 16px; height: 81px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 16px; height: 21px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 103px; left: calc(61% + 1px); width: 14px; height: 19px; opacity: 0; animation: fall 7.5s ease-in 1.1s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 74%; width: 11px; height: 42px; animation: ooze 5.5s ease-in-out 2.4s infinite"><svg style="position: absolute; top: 0; left: 0; width: 11px; height: 34px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 11px; height: 14px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 55px; left: calc(74% + 0.5px); width: 10px; height: 13px; opacity: 0; animation: fall 5.5s ease-in 2.4s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<div style="position: absolute; top: 26px; left: 87%; width: 17px; height: 106px; animation: ooze 8.5s ease-in-out 4s infinite"><svg style="position: absolute; top: 0; left: 0; width: 17px; height: 90px" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M0 0 H20 C20 10 14 18 14 40 V100 H6 V40 C6 18 0 10 0 0Z" fill="#a50d18"></path></svg><svg style="position: absolute; bottom: 0; left: 0; width: 17px; height: 22px" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg></div>
<svg style="position: absolute; top: 112px; left: calc(87% + 1px); width: 15px; height: 20px; opacity: 0; animation: fall 8.5s ease-in 4s infinite" viewBox="0 0 20 26"><path d="M10 0 C13 6 20 12 20 16 A10 10 0 0 1 0 16 C0 12 7 6 10 0Z" fill="#a50d18"></path><ellipse cx="6.5" cy="16" rx="2" ry="3.5" fill="#ffffff" opacity="0.35"></ellipse></svg>
<svg style="position: absolute; top: 0; left: 0; width: 100%; height: 64px" viewBox="0 0 1200 64" preserveAspectRatio="none"><path fill="#a50d18" d="M0,0 H1200 V30 Q1180,40 1160,34 Q1140,52 1118,36 Q1090,30 1060,38 Q1040,46 1020,34 Q990,28 960,40 Q940,56 918,38 Q890,30 860,34 Q840,44 820,32 Q790,28 760,36 Q740,50 716,36 Q690,30 660,38 Q640,46 620,34 Q590,28 560,40 Q540,58 516,38 Q490,30 460,34 Q440,44 420,32 Q390,28 360,38 Q340,52 316,36 Q290,30 260,40 Q240,48 220,34 Q190,28 160,36 Q140,54 116,38 Q90,30 60,36 Q40,46 20,34 Q10,30 0,34 Z"></path><path fill="#c1121f" d="M0,0 H1200 V12 Q1100,20 1000,14 Q900,8 800,16 Q700,22 600,14 Q500,8 400,16 Q300,22 200,14 Q100,8 0,16 Z"></path></svg>
</div>

<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; overflow-y: auto; padding: 84px 18px 120px; box-sizing: border-box">

<sc-if value="{{onPicker}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 28px; padding-top: 72px">
<header style="display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #6b5557">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" fill="#c1121f"></path></svg>
<span>St. Hallow's General · Ward 13</span>
</div>
<h1 style="{{titleStyle}}">Patient Zero</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4a3638; max-width: 380px">Something is spreading in this hospital. Check your band in secret and tap your role to read your orders.</p>
</header>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 14px 18px; border-radius: 16px; cursor: pointer; text-align: left; background: #ffffff; color: #241517; border: 2px solid #241517; box-shadow: 4px 4px 0 #c1121f">
<span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0">
<sc-if value="{{r.isPatient}}" hint-placeholder-val="{{ true }}"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#c1121f"></circle></svg></sc-if>
<sc-if value="{{r.isDoctor}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" fill="#c1121f"></path></svg></sc-if>
<sc-if value="{{r.isPZ}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 5L23 23M23 5L5 23" stroke="#241517" stroke-width="6" stroke-linecap="round"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 19px; font-weight: 700">{{r.label}}</span>
<span style="font-size: 13px; color: #6b5557">{{r.sub}}</span>
</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c1121f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
<p style="margin: 0; text-align: center; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6b5557">Lab results at midnight · Drink water · Don't die</p>
</div>
</sc-if>

<sc-if value="{{onCards}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<button type="button" onClick="{{toRoles}}" style="min-height: 44px; padding: 0 16px; background: #ffffff; color: #241517; border: 2px solid #241517; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600">All roles</button>
<span style="{{chipStyle}}">{{roleLabel}}</span>
</div>
<div style="display: flex; gap: 6px" aria-hidden="true">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<span style="{{d.style}}"></span>
</sc-for>
</div>

<div onTouchStart="{{touchStart}}" onTouchEnd="{{touchEnd}}" style="background: #ffffff; border: 2px solid #241517; border-radius: 18px; overflow: hidden; box-shadow: 6px 6px 0 #c1121f; touch-action: pan-y">
<div style="{{stripStyle}}">
<span>{{card.kicker}} orders</span>
<span>{{stepLabel}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 20px 26px; text-align: center">
<div style="width: 172px; height: 172px; border-radius: 50%; background: #fdecee; border: 2px dashed #e7a3a8; display: flex; align-items: center; justify-content: center">
<sc-if value="{{art.band}}" hint-placeholder-val="{{ true }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Patient wristband"><g style="animation: wobble 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center"><rect x="20" y="78" width="160" height="44" rx="22" fill="#ffffff" stroke="#241517" stroke-width="3"></rect><rect x="60" y="86" width="80" height="28" rx="4" fill="#ffffff" stroke="#c1121f" stroke-width="2"></rect><path d="M70 92v16M75 92v16M78 92v16M84 92v16M90 92v16M93 92v16M99 92v16M104 92v16M110 92v16M113 92v16M119 92v16M124 92v16M130 92v16" stroke="#241517" stroke-width="2"></path><circle cx="36" cy="100" r="5" fill="#c1121f"></circle><path d="M150 120 C154 134 156 142 150 150 C144 142 146 134 150 120Z" fill="#c1121f"></path></g></svg>
</sc-if>
<sc-if value="{{art.sticker}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Ghost sticker slapping down"><g style="animation: slap 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center"><path d="M60 150 V90 A40 40 0 0 1 140 90 V150 Q130 140 120 150 Q110 160 100 150 Q90 140 80 150 Q70 160 60 150Z" transform="translate(5 6)" fill="#241517" stroke="#241517" stroke-width="20" stroke-linejoin="round" opacity="0.15"></path><path d="M60 150 V90 A40 40 0 0 1 140 90 V150 Q130 140 120 150 Q110 160 100 150 Q90 140 80 150 Q70 160 60 150Z" fill="#241517" stroke="#241517" stroke-width="20" stroke-linejoin="round"></path><path d="M60 150 V90 A40 40 0 0 1 140 90 V150 Q130 140 120 150 Q110 160 100 150 Q90 140 80 150 Q70 160 60 150Z" fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round"></path><path d="M60 150 V90 A40 40 0 0 1 140 90 V150 Q130 140 120 150 Q110 160 100 150 Q90 140 80 150 Q70 160 60 150Z" fill="#ffffff" stroke="#241517" stroke-width="3" stroke-linejoin="round"></path><ellipse cx="86" cy="96" rx="6" ry="9" fill="#241517"></ellipse><ellipse cx="114" cy="96" rx="6" ry="9" fill="#241517"></ellipse><circle cx="88" cy="92" r="2" fill="#ffffff"></circle><circle cx="116" cy="92" r="2" fill="#ffffff"></circle><ellipse cx="100" cy="120" rx="5" ry="7" fill="#241517"></ellipse><circle cx="76" cy="112" r="5" fill="#c1121f" opacity="0.55"></circle><circle cx="124" cy="112" r="5" fill="#c1121f" opacity="0.55"></circle></g></svg>
</sc-if>
<sc-if value="{{art.bandaid}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Band-aid"><g style="animation: wobble 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center"><g transform="rotate(-30 100 100)"><rect x="30" y="76" width="140" height="48" rx="24" fill="#e8b892" stroke="#241517" stroke-width="3"></rect><rect x="78" y="82" width="44" height="36" rx="6" fill="#f6e3d1"></rect><g fill="#b07a52"><circle cx="45" cy="92" r="2"></circle><circle cx="55" cy="108" r="2"></circle><circle cx="145" cy="92" r="2"></circle><circle cx="155" cy="108" r="2"></circle></g><circle cx="100" cy="100" r="8" fill="#c1121f"></circle></g></g></svg>
</sc-if>
<sc-if value="{{art.flatline}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Heart monitor flatlining"><rect x="10" y="44" width="180" height="112" rx="12" fill="#241517" stroke="#241517" stroke-width="3"></rect><path d="M20 100 H60 L70 70 L82 130 L92 100 H190" fill="none" stroke="#ff4a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray: 280; stroke-dashoffset: 280; animation: draw 3s linear infinite"></path><circle cx="172" cy="60" r="5" fill="#ff4a4a" style="animation: flash 1s linear infinite"></circle></svg>
</sc-if>
<sc-if value="{{art.heart}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Beating heart"><path d="M100 150 C44 114 34 78 56 58 C75 44 94 52 100 68 C106 52 125 44 144 58 C166 78 156 114 100 150Z" fill="#c1121f" stroke="#241517" stroke-width="3" style="animation: beat 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center"></path><path d="M100 156 C104 164 108 170 100 174 C92 170 96 164 100 156Z" fill="#c1121f" style="animation: drip 1.6s ease-in infinite; transform-box: fill-box; transform-origin: center"></path></svg>
</sc-if>
<sc-if value="{{art.pill}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Bouncing pill"><ellipse cx="100" cy="166" rx="40" ry="6" fill="#241517" opacity="0.15"></ellipse><g style="animation: bounce 1s ease-in-out infinite"><g transform="rotate(-35 100 100)"><rect x="50" y="80" width="100" height="40" rx="20" fill="#ffffff" stroke="#241517" stroke-width="3"></rect><path d="M100 81.5 H130 A18.5 18.5 0 0 1 130 118.5 H100Z" fill="#c1121f"></path></g></g></svg>
</sc-if>
<sc-if value="{{art.syringe}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="150" viewBox="0 0 200 200" role="img" aria-label="Syringe dripping blood"><g transform="rotate(20 100 90)"><rect x="80" y="10" width="40" height="6" rx="2" fill="#241517"></rect><rect x="96" y="16" width="8" height="22" fill="#241517"></rect><rect x="78" y="36" width="44" height="6" rx="2" fill="#241517"></rect><rect x="84" y="42" width="32" height="76" rx="4" fill="#ffffff" stroke="#241517" stroke-width="3"></rect><rect x="88" y="70" width="24" height="44" rx="2" fill="#c1121f"></rect><path d="M84 54h8M84 66h8M84 78h8M84 90h8M84 102h8" stroke="#241517" stroke-width="2"></path><rect x="94" y="118" width="12" height="8" fill="#241517"></rect><path d="M100 126 V158" stroke="#6b5557" stroke-width="3" stroke-linecap="round"></path></g><path d="M78 150 C82 158 86 164 78 168 C70 164 74 158 78 150Z" fill="#c1121f" style="animation: drip 1.4s ease-in infinite; transform-box: fill-box; transform-origin: center"></path><ellipse cx="78" cy="190" rx="16" ry="4" fill="#a50d18" style="animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center"></ellipse></svg>
</sc-if>
<sc-if value="{{art.cup}}" hint-placeholder-val="{{ false }}">

<script type="text/x-dc" data-dc-script data-props='{"titleFont":{"editor":"enum","options":["Creepster","Nosifer","Butcherman","Eater","Rubik Wet Paint","Jolly Lodger"],"default":"Creepster","section":"Fonts"},"bodyFont":{"editor":"enum","options":["Special Elite","Courier Prime","IBM Plex Mono","Work Sans"],"default":"Special Elite","section":"Fonts"},"headingsInTitleFont":{"editor":"boolean","default":false,"section":"Fonts"},"$preview":{"width":430,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: null, step: 0 };
  }
  renderVals() {
    var self = this;
    var role = this.state.role;
    var step = this.state.step;
    var TITLE_SIZES = { "Creepster": 80, "Nosifer": 42, "Butcherman": 54, "Eater": 52, "Rubik Wet Paint": 60, "Jolly Lodger": 88 };
    var BODY_STACKS = {
      "Special Elite": "'Special Elite', 'Courier New', monospace",
      "Courier Prime": "'Courier Prime', 'Courier New', monospace",
      "IBM Plex Mono": "'IBM Plex Mono', ui-monospace, monospace",
      "Work Sans": "'Work Sans', system-ui, sans-serif"
    };
    var titleFont = this.props.titleFont ?? "Creepster";
    var bodyFont = this.props.bodyFont ?? "Special Elite";
    var useTitleHeads = this.props.headingsInTitleFont ?? false;
    var titleSize = TITLE_SIZES[titleFont] || 72;
    var titleStack = "'" + titleFont + "', cursive";
    var ROLES = [
      { id: "patient", label: "Patient", sub: "Most of you", color: "#c1121f" },
      { id: "doctor", label: "Doctor", sub: "Secret. Shh.", color: "#8a0a12" },
      { id: "pz", label: "Patient Zero", sub: "Secret. Shh.", color: "#241517" }
    ];
    var DECKS = {
      patient: [
        { art: "band", head: "You're a Patient.", body: "Most people are. Keep your band on and enjoy the party." },
        { art: "virus", head: "Something's spreading.", body: "A few secret Patient Zeros are sneaking infection stickers onto people." },
        { art: "sticker", head: "Check yourself.", body: "Back, sleeves, band. Find a sticker on you? You're infected. Don't peel it off." },
        { art: "bandaid", head: "Find a doctor.", body: "Doctors are hiding among you. Find one and they can cover your sticker with a band-aid to cure you." },
        { art: "magnifier", head: "Trust no one.", body: "Anyone could be a doctor. Anyone could be Patient Zero. Spread the word if you see someone sneak a sticker on." },
        { art: "flatline", head: "Lab results at midnight.", body: "If more than half the party is infected, Patient Zeros win. Otherwise, you and the doctors win." }
      ],
      doctor: [
        { art: "stethoscope", head: "You're a Doctor.", body: "Tell no one. Your band looks like everyone else's." },
        { art: "virus", head: "Hunt Patient Zero.", body: "A few secret patients are sneaking infection stickers onto people. Find them." },
        { art: "siren", head: "Call a Code Blue.", body: "Think you know who it is? Yell Code Blue and name them. You only get one." },
        { art: "magnifier", head: "Choose wisely.", body: "Right: their stickers are taken and they're out. Wrong: you're infected. Either way, your cover is blown." },
        { art: "bandaid", head: "You have 3 band-aids.", body: "Cover an infected person's sticker to cure them. Careful: every cure tells someone who you are." },
        { art: "flatline", head: "Win at midnight.", body: "If half the party or fewer is infected, doctors win. Watch out: Patient Zero can infect you too." }
      ],
      pz: [
        { art: "skull", head: "You are Patient Zero.", body: "Tell no one. Close this page if anyone's looking." },
        { art: "band", head: "Blend in.", body: "Your band looks like everyone else's. Act like a normal patient." },
        { art: "virus", head: "You carry the infection.", body: "Only Patient Zeros have stickers. Keep yours hidden." },
        { art: "sticker", head: "Stick and walk away.", body: "Backs, sleeves, bands. The less they notice, the better. Doctors count too." },
        { art: "siren", head: "Doctors are hidden.", body: "Anyone could be one. If a doctor calls Code Blue on you, your stickers are taken. Infections already out still count." },
        { art: "clock", head: "Win at midnight.", body: "If more than half the party is wearing an uncovered sticker, Patient Zeros win." }
      ]
    };
    var roleDef = ROLES.filter(function (r) { return r.id === role; })[0];
    var deck = [];
    if (roleDef) {
      deck = DECKS[role].map(function (c) {
        return { art: c.art, kicker: roleDef.label, head: c.head, body: c.body };
      });
    }
    var total = deck.length;
    var s = Math.min(step, Math.max(total - 1, 0));
    var card = deck[s] || { art: "band", kicker: "", head: "", body: "" };
    var artKeys = ["band", "sticker", "bandaid", "flatline", "heart", "pill", "syringe", "cup", "stethoscope", "clipboard", "siren", "magnifier", "skull", "virus", "clock"];
    var art = {};
    artKeys.forEach(function (k) { art[k] = card.art === k; });
    var color = roleDef ? roleDef.color : "#c1121f";
    var dots = deck.map(function (c, i) {
      var bg = i <= s ? color : "#e8d5d6";
      return { style: "flex:1;height:8px;border-radius:4px;background:" + bg + ";" };
    });
    return {
      bodyFont: BODY_STACKS[bodyFont] || BODY_STACKS["Special Elite"],
      titleStyle: "margin:0;font-family:" + titleStack + ";font-weight:400;font-size:" + titleSize + "px;line-height:1;color:#c1121f;text-shadow:3px 3px 0 #241517;overflow-wrap:anywhere;",
      headStyle: useTitleHeads
        ? "margin:0;font-family:" + titleStack + ";font-weight:400;font-size:" + Math.round(titleSize * 0.45) + "px;line-height:1.1;color:#c1121f;"
        : "margin:0;font-size:26px;line-height:1.2;font-weight:700;color:#241517;",
      onPicker: !roleDef,
      onCards: !!roleDef,
      roles: ROLES.map(function (r) {
        return {
          label: r.label,
          sub: r.sub,
          pick: function () { self.setState({ role: r.id, step: 0 }); },
          isPatient: r.id === "patient",
          isDoctor: r.id === "doctor",
          isPZ: r.id === "pz"
        };
      }),
      roleLabel: roleDef ? roleDef.label : "",
      chipStyle: "padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#ffffff;background:" + color + ";",
      stripStyle: "display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff;background:" + color + ";",
      dots: dots,
      card: card,
      art: art,
      stepLabel: "Rule " + (s + 1) + " of " + total,
      showBack: s > 0,
      onFirst: s === 0,
      nextLabel: s === total - 1 ? "Start over" : "Next",
      toRoles: function () { self.setState({ role: null, step: 0 }); },
      back: function () {
        if (s === 0) { self.setState({ role: null, step: 0 }); }
        else { self.setState({ step: s - 1 }); }
      },
      next: function () {
        if (s >= total - 1) { self.setState({ step: 0 }); }
        else { self.setState({ step: s + 1 }); }
      },
      touchStart: function (e) { self._tx = (e.touches && e.touches[0]) ? e.touches[0].clientX : null; },
      touchEnd: function (e) {
        if (self._tx == null || !e.changedTouches || !e.changedTouches[0]) { return; }
        var dx = e.changedTouches[0].clientX - self._tx;
        self._tx = null;
        if (dx < -50 && s < total - 1) { self.setState({ step: s + 1 }); }
        else if (dx > 50 && s > 0) { self.setState({ step: s - 1 }); }
      }
    };
  }
}
</script>
